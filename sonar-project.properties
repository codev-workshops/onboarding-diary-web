sonar.projectKey=onboarding-diary-web
sonar.projectName=Onboarding Diary Web
sonar.projectVersion=1.0.0

sonar.sources=backend/src,frontend/src
sonar.tests=backend/src/__tests__,frontend/src/__tests__
